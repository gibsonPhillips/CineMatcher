<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom List</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/controls.css">
    <link rel="stylesheet" href="../styles/custom.css">
</head>

<body>

    <div style="text-align:center; margin-bottom: 20px;">
        <h1 style="color:var(--need); margin:0;">CineMatcher</h1>
        <p style="color:#aaa; margin:5px 0 0 0;">Add your own media here!</p>
    </div>

    <div class="container">
        <!-- Left Column:  -->
        <div class="panel">
            <form>
                <div class="input-card" id="inputCard">
                    <input type="text" id="custom-list-input" name="custom-list-input" placeholder="movie title">
                </div>
                <div class="tier-buttons">
                    <div class="add-to-list-buttons">
                        <button type="submit" class="btn btn-submit-item">Submit</button>
                        <button class="btn btn-custom" title="Make your own custom list"
                            onclick="window.location.href='pages/make_custom.html'">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                                fill="#e3e3e3">
                                <path
                                    d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z" />
                            </svg>
                        </button>
                    </div>
                    <div class="endlist-buttons">
                        <button class="btn btn-skip">Start voting</button>
                        <button class="btn btn-custom" title="Make your own custom list"
                            onclick="window.location.href='pages/make_custom.html'">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                                fill="#e3e3e3">
                                <path
                                    d="M480-480ZM202-65l-56-57 118-118h-90v-80h226v226h-80v-89L202-65Zm278-15v-80h240v-440H520v-200H240v400h-80v-400q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H480Z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </form>
        </div>



        <div class="panel" id="custom-list-panel">
            <div id="leaderboard">
                <p style="color:#aaa; font-style:italic;">Add your own items to the list...</p>
            </div>

        </div>
    </div>


    <!-- includes Firebase JavaScript SDK CDNs -->
    <script type="module" src="../scripts/customList.js"></script>
</body>

</html>
